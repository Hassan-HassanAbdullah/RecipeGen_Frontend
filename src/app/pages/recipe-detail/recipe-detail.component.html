<main [ngClass]="{ 'urdu-layout': isUrduRecipe }">
    <div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-8 pt-25">
        <div class="max-w-4xl mx-auto px-4">
            <a routerLink="/" class="inline-flex items-center text-[#EC823C] hover:text-[#F76C10] mb-6"><svg
                    xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-left mr-2 h-4 w-4"
                    data-replit-metadata="client/src/pages/recipe-detail.tsx:183:10" data-component-name="ArrowLeft">
                    <path d="m12 19-7-7 7-7"></path>
                    <path d="M19 12H5"></path>
                </svg>
                Back to Recipes
            </a>


            <div class="relative h-[300px] rounded-lg shadow-sm mb-8 overflow-hidden dark:shadow-lg">
                <img [src]="recipe.imageUrl || 'assets/Fresh_ingredients_hero_image.png'" alt="{{recipe.name}}" loading="lazy"
                    class="absolute inset-0 w-full h-full object-cover z-0">

                <div class="absolute inset-0 z-10 flex flex-col justify-end p-6 md:p-8 text-white"
                    style="background-image: linear-gradient(to top, #F76C10, rgba(247, 108, 16, 0.5), rgba(247, 108, 16, 0));">

                    <div class="w-full">
                        <div class=" tracking-tight text-3xl font-bold mb-2 text-white dark:text-white"
                            [ngClass]="{ 'urdu-text': isUrduRecipe }">
                            {{recipe.name}}
                        </div>
                        <p class=" text-lg text-white dark:text-gray-200" [ngClass]="{ 'urdu-text': isUrduRecipe }">
                            {{recipe.description }}
                        </p>
                    </div>

                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mt-6">
                        <div class="w-full"></div>

                        <div class="flex gap-2 justify-end">
                            <button (click)="handleSave(recipe)"
                                class="relative inline-flex items-center justify-center gap-2 rounded-lg px-5 py-2.5 text-sm font-medium border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-100 hover:text-gray-900 dark:bg-gray-800 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:text-white focus:outline-none focus:ring-2 focus:ring-[#F76C10] focus:ring-offset-2 transition-all duration-200 ease-in-out disabled:opacity-50 disabled:pointer-events-none">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"
                                    width="24" height="24">
                                    <path
                                        d="M6.09 21.06a1 1 0 0 1-1-1L4.94 5.4a2.26 2.26 0 0 1 2.18-2.35L16.71 3a2.27 2.27 0 0 1 2.23 2.31l.14 14.66a1 1 0 0 1-.49.87 1 1 0 0 1-1 0l-5.7-3.16-5.29 3.23a1.2 1.2 0 0 1-.51.15zm5.76-5.55a1.11 1.11 0 0 1 .5.12l4.71 2.61-.12-12.95c0-.2-.13-.34-.21-.33l-9.6.09c-.08 0-.19.13-.19.33l.12 12.9 4.28-2.63a1.06 1.06 0 0 1 .51-.14z" />
                                </svg>

                                Save
                            </button>
                            <!-- Translate Button -->
                            <button (click)="handleTranslate(recipe)"
                                class="relative inline-flex items-center justify-center gap-2 rounded-lg px-5 py-2.5 text-sm font-medium border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-100 hover:text-gray-900 dark:bg-gray-800 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:text-white focus:outline-none focus:ring-2 focus:ring-[#F76C10] focus:ring-offset-2  transition-all duration-200 ease-in-out disabled:opacity-50 disabled:pointer-events-none">

                                <!-- Loading Spinner -->
                                <svg *ngIf="isTranslating" class="animate-spin h-4 w-4 text-[#F76C10]"
                                    xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                        stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                                </svg>

                                <!-- Normal Icon (jab loading nahi ho) -->
                                <svg *ngIf="!isTranslating" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                                    <path d="M2 12h20"></path>
                                </svg>

                                <span>{{ isTranslating ? 'Translating...' : 'Translate' }}</span>
                            </button>

                            <button
                                class="relative inline-flex items-center justify-center gap-2 rounded-lg px-5 py-2.5 text-sm font-medium border border-gray-300 bg-white text-gray-700 shadow-sm hover:bg-gray-100 hover:text-gray-900 dark:bg-gray-800 dark:text-gray-200 dark:border-gray-600 dark:hover:bg-gray-700 dark:hover:text-white  focus:outline-none focus:ring-2 focus:ring-[#F76C10] focus:ring-offset-2 transition-all duration-200 ease-in-out disabled:opacity-50 disabled:pointer-events-none"
                                (click)="handleDownload(recipe)"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                                    height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-download mr-2 h-4 w-4">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" x2="12" y1="15" y2="3"></line>
                                </svg>Download</button>
                        </div>
                    </div>
                </div>
            </div>



            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1">
                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div
                            class="rounded-lg  bg-card text-card-foreground shadow-sm dark:bg-gray-800 dark:border-none">
                            <div class="p-4 text-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-clock text-[#F76C10] mx-auto mb-2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                <div class="text-sm text-gray-600 dark:text-gray-300">Prep Time
                                </div>
                                <div class="font-semibold dark:text-gray-200 ">{{recipe.totalTime}}</div>
                            </div>
                        </div>
                        <div
                            class="rounded-lg  bg-card text-card-foreground shadow-sm dark:bg-gray-800 dark:border-none">
                            <div class="p-4 text-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-flame text-[#F76C10] mx-auto mb-2">
                                    <path
                                        d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z">
                                    </path>
                                </svg>
                                <div class="text-sm text-gray-600 dark:text-gray-300">Cook Time
                                </div>
                                <div class="font-semibold dark:text-gray-200 ">{{recipe.timeToCook}}</div>
                            </div>
                        </div>
                        <div
                            class="rounded-lg  bg-card text-card-foreground shadow-sm dark:bg-gray-800 dark:border-none">
                            <div class="p-4 text-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-users text-[#F76C10] mx-auto mb-2">
                                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="9" cy="7" r="4"></circle>
                                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                                </svg>
                                <div class="text-sm text-gray-600 dark:text-gray-300">Servings
                                </div>
                                <div class="font-semibold dark:text-gray-200 ">{{recipe.servings}}</div>
                            </div>
                        </div>
                        <div
                            class="rounded-lg  bg-card text-card-foreground shadow-sm dark:bg-gray-800 dark:border-none">
                            <div class="p-4 text-center"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round"
                                    class="lucide lucide-circle-check-big text-[#F76C10] mx-auto mb-2">
                                    <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                                    <path d="m9 11 3 3L22 4"></path>
                                </svg>
                                <div class="text-sm text-gray-600 dark:text-gray-300">
                                    Difficulty</div>
                                <div class="font-semibold dark:text-gray-200 ">Easy</div>
                            </div>
                        </div>
                    </div>
                    <div class="mb-6">
                        <div
                            class="inline-flex items-center rounded-full  px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 border-transparent hover:bg-secondary/80 bg-green-100 text-green-600">
                            {{recipe.cuisine}}</div>
                    </div>
                </div>
                <div class="lg:col-span-2 space-y-8">
                    <div class="rounded-lg  bg-card text-card-foreground shadow-sm dark:bg-gray-800 dark:border-none">
                        <div class="flex flex-col space-y-1.5 p-6">
                            <div
                                class="text-2xl font-semibold leading-none tracking-tight flex items-center dark:text-white">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-circle-check-big text-[#F76C10] mr-2"
                                    data-replit-metadata="client/src/pages/recipe-detail.tsx:270:18"
                                    data-component-name="CheckCircle">
                                    <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                                    <path d="m9 11 3 3L22 4"></path>
                                </svg>Ingredients
                            </div>
                        </div>
                        <div class="p-6 pt-0">
                            <ul class="space-y-3">
                                <li *ngFor="let ingredient of recipe.ingredients"
                                    class=" flex items-center text-gray-700 dark:text-gray-300"
                                    [ngClass]="{ 'urdu-text': isUrduRecipe }">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round"
                                        class="lucide lucide-circle-check-big text-green-500 mr-3 h-4 w-4 flex-shrink-0">
                                        <path d="M21.801 10A10 10 0 1 1 17 3.335"></path>
                                        <path d="m9 11 3 3L22 4"></path>
                                    </svg><span>{{ingredient}}</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="rounded-lg  bg-card text-card-foreground shadow-sm dark:bg-gray-800 dark:border-none">
                        <div class="flex flex-col space-y-1.5 p-6">
                            <div
                                class="text-2xl font-semibold leading-none tracking-tight flex items-center dark:text-white ">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-flame text-[#F76C10] mr-2">
                                    <path
                                        d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z">
                                    </path>
                                </svg>Instructions
                            </div>
                        </div>
                        <div class="p-6 pt-0">
                            <ol class="space-y-6">
                                <li class="flex text-gray-700 dark:text-gray-300"
                                    *ngFor="let instructions of recipe.steps; let i=index "><span
                                        class="bg-[#F76C10] text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-semibold mr-4 mt-0.5 flex-shrink-0">{{i+1}}</span><span
                                        class="leading-relaxed "
                                        [ngClass]="{ 'urdu-text': isUrduRecipe }">{{instructions}}</span>
                                </li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
