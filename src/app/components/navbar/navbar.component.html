<section
    class="fixed top-2 left-1/2  -translate-x-1/2 w-[95%] sm:w-[90%] md:w-[85%] px-6 py-3 sm:py-3 z-30 bg-white/10 backdrop-blur-md rounded-full border border-white/20 shadow-sm animate-slideDown">
    <div class="flex items-center justify-between">
        <a routerLink="/" class="flex items-center justify-center cursor-pointer gap-2 text-[#ec823c]">
            <svg viewBox="0 0 24 24" class="w-8 h-8 font-bold" fill="none" xmlns="http://www.w3.org/2000/svg"
                transform="matrix(1, 0, 0, 1, 0, 0)rotate(0)">
                <g id="SVGRepo_bgCarrier" stroke-width="1.5"></g>
                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round" stroke="#CCCCCC"
                    stroke-width="0.048"></g>
                <g id="SVGRepo_iconCarrier">
                    <path
                        d="M19 18H19.75H19ZM5 14.584H5.75C5.75 14.2859 5.57345 14.016 5.30028 13.8967L5 14.584ZM19 14.584L18.6997 13.8967C18.4265 14.016 18.25 14.2859 18.25 14.584H19ZM15.75 7C15.75 7.41421 16.0858 7.75 16.5 7.75C16.9142 7.75 17.25 7.41421 17.25 7H15.75ZM6.75 7C6.75 7.41421 7.08579 7.75 7.5 7.75C7.91421 7.75 8.25 7.41421 8.25 7H6.75ZM7 4.25C3.82436 4.25 1.25 6.82436 1.25 10H2.75C2.75 7.65279 4.65279 5.75 7 5.75V4.25ZM17 5.75C19.3472 5.75 21.25 7.65279 21.25 10H22.75C22.75 6.82436 20.1756 4.25 17 4.25V5.75ZM15 21.25H9V22.75H15V21.25ZM9 21.25C8.03599 21.25 7.38843 21.2484 6.90539 21.1835C6.44393 21.1214 6.24643 21.0142 6.11612 20.8839L5.05546 21.9445C5.51093 22.4 6.07773 22.5857 6.70552 22.6701C7.31174 22.7516 8.07839 22.75 9 22.75V21.25ZM4.25 18C4.25 18.9216 4.24841 19.6883 4.32991 20.2945C4.41432 20.9223 4.59999 21.4891 5.05546 21.9445L6.11612 20.8839C5.9858 20.7536 5.87858 20.5561 5.81654 20.0946C5.75159 19.6116 5.75 18.964 5.75 18H4.25ZM18.25 18C18.25 18.964 18.2484 19.6116 18.1835 20.0946C18.1214 20.5561 18.0142 20.7536 17.8839 20.8839L18.9445 21.9445C19.4 21.4891 19.5857 20.9223 19.6701 20.2945C19.7516 19.6883 19.75 18.9216 19.75 18H18.25ZM15 22.75C15.9216 22.75 16.6883 22.7516 17.2945 22.6701C17.9223 22.5857 18.4891 22.4 18.9445 21.9445L17.8839 20.8839C17.7536 21.0142 17.5561 21.1214 17.0946 21.1835C16.6116 21.2484 15.964 21.25 15 21.25V22.75ZM7 5.75C7.2137 5.75 7.42326 5.76571 7.6277 5.79593L7.84703 4.31205C7.57021 4.27114 7.28734 4.25 7 4.25V5.75ZM12 1.25C9.68949 1.25 7.72942 2.7421 7.02709 4.81312L8.44763 5.29486C8.94981 3.81402 10.3516 2.75 12 2.75V1.25ZM7.02709 4.81312C6.84722 5.34352 6.75 5.91118 6.75 6.5H8.25C8.25 6.07715 8.3197 5.67212 8.44763 5.29486L7.02709 4.81312ZM17 4.25C16.7127 4.25 16.4298 4.27114 16.153 4.31205L16.3723 5.79593C16.5767 5.76571 16.7863 5.75 17 5.75V4.25ZM12 2.75C13.6484 2.75 15.0502 3.81402 15.5524 5.29486L16.9729 4.81312C16.2706 2.7421 14.3105 1.25 12 1.25V2.75ZM15.5524 5.29486C15.6803 5.67212 15.75 6.07715 15.75 6.5H17.25C17.25 5.91118 17.1528 5.34352 16.9729 4.81312L15.5524 5.29486ZM5.75 18V14.584H4.25V18H5.75ZM5.30028 13.8967C3.79769 13.2402 2.75 11.7416 2.75 10H1.25C1.25 12.359 2.6705 14.3846 4.69972 15.2712L5.30028 13.8967ZM18.25 14.584L18.25 18H19.75L19.75 14.584H18.25ZM21.25 10C21.25 11.7416 20.2023 13.2402 18.6997 13.8967L19.3003 15.2712C21.3295 14.3846 22.75 12.359 22.75 10H21.25ZM15.75 6.5V7H17.25V6.5H15.75ZM6.75 6.5V7H8.25V6.5H6.75Z"
                        fill="#EC823C"></path>
                    <path opacity="0.5" d="M9 18H15" stroke="#EC823C" stroke-width="2.5" stroke-linecap="round"
                        stroke-linejoin="round"></path>
                </g>
            </svg>
            <span class="hidden md:inline text-xl sm:text-2xl font-bold text-black dark:text-white">
                RecipeGen
            </span>
        </a>

        <div class="relative ">
            <button (click)="toggleMenu()"
                class="px-6 py-1.5 rounded-full bg-[#faad654f] dark:bg-[#faad654f] dark:text-white transition-all duration-200 active:scale-95 focus:ring-4 focus:outline-none focus:ring-[#ec823c]"
                aria-label="Toggle mobile menu">

                <div class="relative w-6 h-6">
                    <span
                        [ngClass]="isMenuOpen() ? 'rotate-45 top-1/2 bg-gray-900 dark:bg-white' : 'top-1.5 bg-gray-900 dark:bg-white'"
                        class="absolute left-0 w-6 h-0.5 rounded-full transition-all duration-300 ease-in-out origin-center"></span>

                    <span
                        [ngClass]="isMenuOpen() ? '-rotate-45 top-1/2 bg-gray-900 dark:bg-white' : 'bottom-1.5 bg-gray-900 dark:bg-white'"
                        class="absolute left-0 w-6 h-0.5 rounded-full transition-all duration-300 ease-in-out origin-center">
                    </span>
                </div>
            </button>

            <div *ngIf="isMenuOpen()"
                class="absolute left-1/2 -translate-x-1/2 mt-2 w-44 z-20 bg-white dark:bg-gray-800 border border-orange-200 dark:border-orange-700 shadow-lg rounded-lg transition-all duration-200"
                [ngClass]="isMenuOpen() ? 'opacity-100 scale-100' : 'opacity-0 scale-95'">

                <nav class="flex flex-col py-2">
                    <a routerLink="/" (click)="closeMenu()"
                        class="flex items-center gap-2 px-4 py-2 h-10 text-sm font-medium text-gray-700 dark:text-white hover:bg-orange-50 dark:hover:bg-orange-700/60 transition-colors rounded-sm">
                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z" />
                        </svg>
                        Home
                    </a>
                    <a routerLink="/aboutUs" (click)="closeMenu()"
                        class="flex items-center gap-2 px-4 py-2 h-10 text-sm font-medium text-gray-700 dark:text-white hover:bg-orange-50 dark:hover:bg-orange-700/60 transition-colors rounded-md">
                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h.5a1 1 0 00.5-1V9a1 1 0 00-1-1h-.5a1 1 0 00-1 1z"
                                clip-rule="evenodd" />
                        </svg>
                        About
                    </a>
                    <a routerLink="/genrate_recipy" (click)="closeMenu()"
                        class="flex items-center gap-2 px-4 py-2 h-10 text-sm font-medium text-gray-700 dark:text-white hover:bg-orange-50 dark:hover:bg-orange-700/60 transition-colors rounded-md">
                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M11 3a1 1 0 10-2 0v5h-1a1 1 0 00-1 1v2a1 1 0 001 1h1v3a1 1 0 102 0v-3h1a1 1 0 001-1V9a1 1 0 00-1-1h-1V3z" />
                        </svg>
                        Generate Recipe
                    </a>
                    <a routerLink="/explore-recipe" (click)="closeMenu()"
                        class="flex items-center gap-2 px-4 py-2 h-10 text-sm font-medium text-gray-700 dark:text-white hover:bg-orange-50 dark:hover:bg-orange-700/60 transition-colors rounded-md">
                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M9 3a1 1 0 011 1v2.121a2 2 0 01-.586 1.415L7.414 9H4a1 1 0 01-1-1V4a1 1 0 011-1h5zM15 3a1 1 0 011 1v2.121a2 2 0 01-.586 1.415L13.414 9H10a1 1 0 01-1-1V4a1 1 0 011-1h5zM9 11a1 1 0 011 1v2.121a2 2 0 01-.586 1.415L7.414 17H4a1 1 0 01-1-1v-4a1 1 0 011-1h5z"
                                clip-rule="evenodd" />
                        </svg>
                        Explore
                    </a>
                </nav>
            </div>
        </div>

        <nav class="flex items-center gap-3 sm:gap-4">
            <button (click)="toggleTheme()"
                class="p-2 rounded-lg bg-[#faad654f] dark:bg-[#faad654f] text-black dark:text-white hover:scale-110 transition-all duration-200 focus:ring-4 focus:outline-none focus:ring-[#ec823c]"
                aria-label="Toggle Theme">
                <svg *ngIf="!isDark" xmlns="http://www.w3.org/2000/svg" fill="none"
                    class="w-5 h-5 sm:w-[18px] sm:h-[18px]" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v2.25M18.364 5.636l-1.591 1.591M21 12h-2.25M18.364 18.364l-1.591-1.591M12 18.75V21M7.227 16.773l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0z" />
                </svg>
                <svg *ngIf="isDark" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-[18px] sm:h-[18px]"
                    fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998z" />
                </svg>
            </button>

            <button *ngIf="user; else loginBtn" id="dropdownAvatarNameButton" data-dropdown-toggle="dropdownAvatarName"
                class="relative flex items-center text-xs sm:text-sm font-medium text-gray-900 dark:text-white rounded-full hover:text-[#ec823c] dark:hover:text-[#f59453] focus:ring-4 focus:ring-gray-100 dark:focus:ring-gray-700"
                type="button">
                <span class="sr-only">Open user menu</span>
                <svg class="w-7 h-7 sm:w-8 sm:h-8 me-1 sm:me-2 text-gray-400" xmlns="http://www.w3.org/2000/svg"
                    fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" />
                </svg>
                <span class="hidden sm:inline">Welcome, {{ user?.name }}</span>
                <svg class="w-2.5 h-2.5 ms-2" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 10 6">
                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="m1 1 4 4 4-4" />
                </svg>
            </button>

            <div id="dropdownAvatarName"
                class="absolute right-2 mt-2 z-20 hidden bg-white divide-y divide-gray-100 rounded-lg shadow-lg w-44 sm:w-48 dark:bg-gray-800 dark:divide-gray-600">
                <div class="px-4 py-3 text-sm text-gray-900 dark:text-white">
                    <div class="font-semibold">{{ user?.name }}</div>
                    <div class="truncate text-xs text-gray-500 dark:text-gray-300">
                        {{ user?.email }}
                    </div>
                </div>
                <ul class="py-2 text-sm text-gray-700 dark:text-gray-200">
                    <li>
                        <a [routerLink]="'/user-Profile'"
                            class="block px-4 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 dark:hover:text-white">
                            Profile
                        </a>
                    </li>
                </ul>
                <div class="py-2 border-t border-gray-200 dark:border-gray-600">
                    <a (click)="logout()"
                        class="block px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-gray-700 dark:text-red-400 dark:hover:text-white">
                        Sign out
                    </a>
                </div>
            </div>

            <ng-template #loginBtn>
                <button (click)="showAuthCard()"
                    class="text-white bg-gradient-to-r from-[#e76e1c] via-[#ec823c] to-[#f29a5e] hover:bg-gradient-to-br focus:ring-4 focus:outline-none focus:ring-[#f1c09f] dark:focus:ring-[#ec823c] font-medium rounded-lg text-xs sm:text-sm px-4 sm:px-5 py-2 sm:py-2.5">
                    Login
                </button>
            </ng-template>
        </nav>
    </div>
</section>
