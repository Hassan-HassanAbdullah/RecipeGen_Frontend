<div
    class="relative bg-white dark:bg-gray-800 rounded-2xl overflow-hidden shadow-lg transform hover:scale-[1.03] hover:shadow-2xl transition-all duration-300 flex flex-col cursor-pointer ">

    <!-- Recipe Image with Gradient Overlay -->
    <div routerLink="/recipe-detail" [queryParams]="{ recipe: getEncodedRecipe() }"
        class="relative h-52 w-full overflow-hidden">
        <img [src]="recipe.imageUrl || randomImage" alt="{{ recipe.name }}" loading="lazy"
            class="w-full h-full object-cover object-center transition-transform duration-500 hover:scale-105">


        <!-- Gradient Overlay -->
        <div class="absolute inset-0 z-20 flex flex-col justify-end p-3
         bg-gradient-to-t
         from-black/90 dark:from-gray-900/90
         via-black/40 dark:via-gray-900/40
         to-transparent">

            <!-- Cuisine & Level Tags -->
            <div class="flex justify-between items-center mb-2">
                <span class="bg-[#EC823C]/60 text-white text-xs font-medium px-2 py-1 rounded-full shadow-sm">
                    {{ recipe.cuisine }}
                </span>
                <span class="bg-green-500/70 text-white text-xs font-medium px-2 py-1 rounded-full shadow-sm">
                    medium
                </span>
            </div>
        </div>

    </div>

    <!-- Card Content -->
    <div class="p-5 flex flex-col flex-grow">
        <div routerLink="/recipe-detail" [queryParams]="{ recipe: getEncodedRecipe() }">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white line-clamp-1 mb-2">
                {{ recipe.name }}
            </h3>

            <!-- Description limited to 2 lines -->
            <p class="text-gray-600 dark:text-gray-300 text-sm mb-4 line-clamp-2 overflow-hidden text-ellipsis">
                {{ recipe.description }}
            </p>
        </div>

        <!-- Footer Info -->
        <div
            class="mt-auto flex items-center justify-between pt-3 border-t border-gray-100 dark:border-gray-700 text-sm text-gray-700 dark:text-gray-300">

            <!-- Left Info -->
            <div class="flex items-center gap-4">

                <!-- Cooking Time -->
                <div class="flex items-center gap-1">
                    <svg viewBox="0 0 24 24" class="w-6 h-6 text-gray-500 dark:text-gray-400" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M12 7V12L14.5 10.5M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        </path>
                    </svg>
                    <span class="text-sm">{{ recipe.totalTime }}</span>
                </div>

                <!-- Servings -->
                <div class="flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-500 dark:text-gray-400" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    <span class="text-sm">{{ recipe.servings }}</span>
                </div>
            </div>

            <!-- Save Button -->
            <button (click)="onSave(recipe)" title="Save recipe"
                class="inline-flex items-center justify-center p-2 rounded-full text-gray-500 hover:text-orange-500 hover:bg-orange-50 dark:hover:bg-orange-900/20 transition-colors">

                <svg *ngIf="!isSaved" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" width="24" height="24" class="w-6 h-6">
                    <path
                        d="M6.09 21.06a1 1 0 0 1-1-1L4.94 5.4a2.26 2.26 0 0 1 2.18-2.35L16.71 3a2.27 2.27 0 0 1 2.23 2.31l.14 14.66a1 1 0 0 1-.49.87 1 1 0 0 1-1 0l-5.7-3.16-5.29 3.23a1.2 1.2 0 0 1-.51.15z" />
                </svg>

                <svg *ngIf="isSaved" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="orange"
                    width="24" height="24" class="w-6 h-6">
                    <path
                        d="M6.09 21.06a1 1 0 0 1-1-1L4.94 5.4a2.26 2.26 0 0 1 2.18-2.35L16.71 3a2.27 2.27 0 0 1 2.23 2.31l.14 14.66a1 1 0 0 1-.49.87 1 1 0 0 1-1 0l-5.7-3.16-5.29 3.23a1.2 1.2 0 0 1-.51.15z" />
                </svg>

            </button>
        </div>

        <!-- View Recipe Button -->
        <a routerLink="/recipe-detail" [queryParams]="{ recipe: getEncodedRecipe() }" class="mt-4">
            <button
                class="w-full py-2 rounded-lg bg-[#EC823C] hover:bg-[#D57333] active:bg-[#C2652B] text-white font-medium transition-all duration-300">
                View Recipe
            </button>
        </a>
    </div>
</div>
