<!-- Explore Recipes Page -->
<section id="explore_recipes" class="bg-white dark:bg-gray-900">

  <!-- Hero Header -->
  <div class="relative h-[75vh] flex items-center justify-center text-center">
    <!-- Background Image -->
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836" alt="World Cuisines Background" loading="lazy"
      class="absolute inset-0 w-full h-full object-cover">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/60"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-white dark:to-gray-900"></div>

    <!-- Heading -->
    <div class="relative z-10 px-6">
      <h1
        class="text-4xl md:text-5xl font-extrabold dark:text-white text-gray-950 mb-4 flex items-center justify-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-[#EC823C]" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21
                   c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0
                   a8.997 8.997 0 0 1 7.843 4.582M12 3a8.997 8.997 0 0 0-7.843 4.582m15.686 0
                   A11.953 11.953 0 0 1 12 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0
                   A8.959 8.959 0 0 1 21 12c0 .778-.099 1.533-.284 2.253m0 0
                   A17.919 17.919 0 0 1 12 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0
                   A9.015 9.015 0 0 1 3 12c0-1.605.42-3.113 1.157-4.418" />
        </svg>
        Explore World Cuisines
      </h1>
      <p class="text-lg md:text-xl text-gray-700 dark:text-gray-200 max-w-2xl mx-auto leading-relaxed">
        Discover authentic recipes from around the world 🌍
      </p>
    </div>
  </div>

  <!-- Filters Section -->
  <div class="relative z-20 max-w-5xl mx-auto px-6 -mt-20">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-6 md:p-8 border border-gray-200 dark:border-gray-700">
      <div class="flex flex-col md:flex-row justify-center items-center gap-6">

        <!-- Cuisine Filter -->
        <div class="w-full md:w-1/2">
          <label for="cuisine" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Select a Cuisine
          </label>
          <select id="cuisine" [(ngModel)]="selectedCuisine" (change)="onFilterChange()" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-xl shadow-md
                   focus:ring-2 focus:ring-[#EC823C] focus:border-[#EC823C]
                   block w-full p-3 dark:bg-gray-800 dark:border-gray-600
                   dark:text-white dark:focus:ring-[#EC823C] dark:focus:border-[#EC823C]
                   transition duration-200 ease-in-out hover:shadow-lg">
            <option value="all">🍽️ All Cuisines</option>
            <option *ngFor="let cuisine of cuisines" [value]="cuisine.name">
              {{ cuisine.icon }} {{ cuisine.name }}
            </option>
          </select>
        </div>

        <!-- Dish Type Filter -->
        <div class="w-full md:w-1/2">
          <label for="dishType" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">
            Select Dish Type
          </label>
          <select id="dishType" [(ngModel)]="selectedDishType" (change)="onFilterChange()" class="bg-white border border-gray-300 text-gray-900 text-sm rounded-xl shadow-md
                   focus:ring-2 focus:ring-[#EC823C] focus:border-[#EC823C]
                   block w-full p-3 dark:bg-gray-800 dark:border-gray-600
                   dark:text-white dark:focus:ring-[#EC823C] dark:focus:border-[#EC823C]
                   transition duration-200 ease-in-out hover:shadow-lg">
            <option value="all">🍴 All Dishes</option>
            <option *ngFor="let dish of dishTypes" [value]="dish">
              {{ dish }}
            </option>
          </select>
        </div>

      </div>
    </div>
  </div>

  <!-- Recipes Grid -->
  <div class="max-w-7xl mx-auto px-6 py-16">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- No Recipes -->
      <div *ngIf="filteredRecipes.length === 0" class="col-span-full text-center py-12">
        <p class="text-gray-500 dark:text-gray-400 text-lg">
          No recipes found for {{selectedCuisine}} - {{selectedDishType}}.
        </p>
      </div>

      <!-- Recipe Cards -->
      <div *ngFor="let recipe of filteredRecipes | paginate: { itemsPerPage: 5, currentPage: page }">
        <app-recipe-card [recipe]="recipe"></app-recipe-card>
        
      </div>
    </div>


    <!-- Pagination -->
    <div class="flex justify-center mt-12">
      <pagination-controls (pageChange)="page = $event" previousLabel="Previous" nextLabel="Next" [maxSize]="5"
        [autoHide]="true" class="flex gap-2  text-gray-600 dark:text-gray-300">
      </pagination-controls>
    </div>

  </div>

</section>



<app-footer></app-footer>
